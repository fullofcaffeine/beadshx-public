repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
      - id: forbid-submodules

  - repo: local
    hooks:
      - id: beadshx-local-paths
        name: reject machine-local paths
        entry: scripts/beadshx/check-local-paths-staged.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: beadshx-staged-secrets
        name: scan staged changes for secrets
        entry: scripts/beadshx/check-staged-secrets.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: beadshx-haxe-format
        name: check staged Haxe formatting
        entry: scripts/beadshx/check-haxe-format.sh --staged
        language: system
        pass_filenames: false
        files: \.hx$
      - id: beadshx-go-lint
        name: check staged Go formatting and lint
        entry: scripts/beadshx/check-staged-go.sh
        language: system
        pass_filenames: false
        files: \.go$
