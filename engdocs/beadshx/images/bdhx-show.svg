<text y="253"><tspan x="16" textLength="159.6" lengthAdjust="spacingAndGlyphs" class="c4">ACCEPTANCE CRITERIA</tspan></text>
<text y="304"><tspan x="32.8" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="c5">•</tspan><tspan x="41.2" textLength="470.4" lengthAdjust="spacingAndGlyphs" class="c5"> A sign-in link works once and expires after 15 minutes.</tspan></text>
<text y="321"><tspan x="32.8" textLength="8.4" lengthAdjust="spacingAndGlyphs" class="c5">•</tspan><tspan x="41.2" textLength="327.6" lengthAdjust="spacingAndGlyphs" class="c5"> An expired link shows a clear message.</tspan></text>
